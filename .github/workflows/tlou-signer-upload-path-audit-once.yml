name: TLOU one-time historic upload path analysis
on:
  push:
    branches: [tlou-ui-approval-log32-20261105]
    paths: ['.github/workflows/tlou-signer-upload-path-audit-once.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check historic upload-artifact path globs and key backup commands
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --quiet
          python3 - <<'PY'
          import subprocess, re, collections
          p=subprocess.run(['git','rev-list','--objects','--all'],capture_output=True,text=True,check=True)
          obj=[line.split(' ',1) for line in p.stdout.splitlines() if len(line.split(' ',1))==2 and re.search(r'\.github/workflows/.*\.ya?ml$',line)]
          keys=set(sha for sha,path in obj)
          uploads=collections.Counter()
          suspicious=[]
          direct_backup=[]
          for sha in keys:
            body=subprocess.run(['git','cat-file','-p',sha],capture_output=True,text=True)
            if body.returncode:continue
            lines=body.stdout.splitlines()
            for i,line in enumerate(lines):
              if 'uses: actions/upload-artifact' in line:
                block=lines[i:i+28]
                for j,s in enumerate(block):
                  if re.match(r'^\s+path:\s*(.*)$',s):
                    after=[s.strip()]
                    for t in block[j+1:]:
                      if re.match(r'^\s+(if-no-files-found|retention-days|compression-level|overwrite):',t):break
                      if re.match(r'^\s+- ',t) or (t.startswith('            ') or t.startswith('              ')):
                        after.append(t.strip())
                      else:break
                    name=' | '.join(after)
                    uploads[name]+=1
                    if re.search(r'out/\*\*|out/android-bionic/?\*|experimental-development|\.jks|\.keystore|^path:\s*\.?/?out/?\s*$',name,re.I):
                      suspicious.append((sha,name))
              if re.search(r'gh\s+(release\s+upload|api).*(experimental-development|keystore)|cp\s+.*experimental-development.*(release|artifact)',line,re.I):
                direct_backup.append((sha,line.strip()[:180]))
          print('WORKFLOW_BLOBS',len(keys))
          print('UNIQUE_UPLOAD_PATH_PATTERNS',len(uploads))
          for name,n in uploads.most_common():
            print('UPLOAD_PATH',repr(name),'versions',n)
          print('BROAD_OR_DIRECT_PRIVATE_KEY_UPLOAD_PATHS',len(suspicious))
          for sha,name in sorted(set(suspicious)):print('SUSPICIOUS',sha,repr(name))
          print('DIRECT_KEY_BACKUP_COMMANDS',len(direct_backup))
          for sha,line in sorted(set(direct_backup)):print('DIRECT',sha,repr(line))
          PY
