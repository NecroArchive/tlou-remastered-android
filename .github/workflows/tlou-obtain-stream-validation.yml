name: TLOU ObtainBuffer stream hot path ARM64 x86 proof
on:
  push:
    branches: [perf/tlou-obtain-bindbuffers-v011-20261110]
    paths: [gow3_pc/**, .github/workflows/tlou-obtain-stream-validation.yml]
permissions:
  contents: read
jobs:
  stream-equivalence:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify production stream epoch/tick/hash gate on 1.2M samples per mode
        run: |
          g++ -std=c++20 -O2 -UNDEBUG -Wall -Wextra -Werror \
            -I gow3_pc/gpu/shadps4 \
            gow3_pc/tests/test_tlou_stream_copy_context.cpp \
            -o /tmp/tlou-stream-equivalent
          /tmp/tlou-stream-equivalent
      - name: Address + undefined behavior sanitizers
        run: |
          g++ -std=c++20 -O1 -g -UNDEBUG -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I gow3_pc/gpu/shadps4 \
            gow3_pc/tests/test_tlou_stream_copy_context.cpp \
            -o /tmp/tlou-stream-sanitize
          /tmp/tlou-stream-sanitize
