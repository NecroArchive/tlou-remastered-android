name: TLOU compute cached-hit ARM64 x86 one-off tests
on:
  push:
    branches: [perf/tlou-compute-cached-lookup-20261110]
    paths: [gow3_pc/**, .github/workflows/tlou-compute-hit-validation.yml]
permissions:
  contents: read
jobs:
  compute-hit-equivalence:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate every compute lookup and scheduled queue service
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -I gow3_pc/gpu/shadps4 \
            gow3_pc/tests/test_tlou_compute_cached_hit_gate.cpp \
            -o /tmp/tlou-compute-cache-hit
          /tmp/tlou-compute-cache-hit
      - name: Check UB and address safety
        run: |
          g++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Wall -Wextra -Werror -I gow3_pc/gpu/shadps4 \
            gow3_pc/tests/test_tlou_compute_cached_hit_gate.cpp \
            -o /tmp/tlou-compute-cache-asan
          /tmp/tlou-compute-cache-asan
