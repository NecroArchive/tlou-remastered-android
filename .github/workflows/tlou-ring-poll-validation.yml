name: TLOU ring poll recovery proof ARM64 x86
on:
  push:
    branches: [perf/tlou-ring-timeline-poll-gate-20261109]
    paths: [gow3_pc/**, .github/workflows/tlou-ring-poll-validation.yml]
permissions:
  contents: read
jobs:
  ring-poll:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate actual ring polling helper under heavy misses
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -I gow3_pc/gpu/shadps4 \
            gow3_pc/tests/test_tlou_constant_ring_recycle_gate.cpp \
            -o /tmp/tlou-recycle-gate
          /tmp/tlou-recycle-gate
      - name: Run sanitizers and previous tick progression regression
        run: |
          g++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Wall -Wextra -Werror -I gow3_pc/gpu/shadps4 \
            gow3_pc/tests/test_tlou_constant_ring_recycle_gate.cpp \
            -o /tmp/tlou-recycle-asan
          /tmp/tlou-recycle-asan
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -I gow3_pc/gpu/shadps4 \
            gow3_pc/tests/test_tlou_constant_ring_stamp.cpp \
            -o /tmp/tlou-stamp
          /tmp/tlou-stamp
