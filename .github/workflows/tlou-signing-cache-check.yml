name: TLOU original signing cache availability check
on:
  push:
    branches: [android-bionic-stage1]
    paths:
      - '.github/workflows/tlou-signing-cache-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signing-cache:
    runs-on: ubuntu-24.04
    steps:
      - name: Check original signing cache without downloading private keystore
        id: signing
        uses: actions/cache/restore@v4
        with:
          path: out/android-bionic/experimental-development.jks
          key: tlou-development-signing-v2
          lookup-only: true
      - name: Report cache result without exposing signing material
        env:
          CACHE_HIT: ${{ steps.signing.outputs.cache-hit }}
        run: |
          if [[ "$CACHE_HIT" == "true" ]]; then
            echo "TLOU_ORIGINAL_SIGNER_CACHE=AVAILABLE"
          else
            echo "::error::TLOU_ORIGINAL_SIGNER_CACHE=NOT_FOUND_IN_ANDROID_BIONIC_OR_DEFAULT"
            exit 1
          fi
