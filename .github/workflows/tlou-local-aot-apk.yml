name: TLOU Experimental Local AOT APK

on:
  push:
    branches: [experiment/tlou-local-aot-20261112]
    paths:
      # Only release a new APK when its actual patched compiler artifact is
      # pinned below; source edits/tests must not publish an unusable image.
      - 'android/bionic/repackage_local_aot.py'
      - 'android/bionic/stage_aot_compiler.sh'
      - 'android-launcher/**'
      - '.github/workflows/tlou-local-aot-apk.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: tlou-aotnative-apk-stable-signature
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Check local ARM64 AOT preparation
        run: |
          python3 -m py_compile android/aot/aot_local.py android/aot/test_aot_local.py android/aot/test_aot_quality.py android/bionic/repackage_local_aot.py
          python3 android/aot/test_aot_local.py -v
          python3 android/aot/test_aot_quality.py -v
      - name: Retrieve successful native ARM64 APK
        uses: actions/download-artifact@v4
        with:
          name: TheLastOfUsRemastered-Android-v0.1.1-arm64
          path: out/aot-source-apk
          run-id: '43315820944'
          github-token: ${{ github.token }}
      - name: Download newly compiled ARM64 AOT runtime with TLOU fibers
        uses: actions/download-artifact@v4
        with:
          name: TLOU-AOT-CPU-ARM64-Fiber-Backend
          path: out/aot-native-backend
          run-id: '43337524803'
          github-token: ${{ github.token }}
      - name: Stage verified alternative AOT CPU, leave production FEX intact
        run: |
          set -euo pipefail
          so=out/aot-native-backend/libgow3cpu.so
          test -s "$so"
          python3 - "$so" <<'PY'
          import hashlib,sys
          from pathlib import Path
          path=Path(sys.argv[1])
          expected=Path(str(path)+'.sha256').read_text().split()[0]
          assert hashlib.file_digest(path.open('rb'),'sha256').hexdigest()==expected
          PY
          readelf -h "$so" | grep -E 'Machine:.*AArch64'
          readelf --dyn-syms --wide "$so" | grep -F guest_cpu_fiber_switch
          mkdir -p out/android-bionic/apk-assets/runtime-aot
          cp "$so" out/android-bionic/apk-assets/runtime-aot/libgow3cpu.so
          test -s out/aot-native-backend/libbbcpu.so
          readelf -d out/aot-native-backend/libbbcpu.so | grep -F '[libgow3cpu.so]'
          cp out/aot-native-backend/libbbcpu.so out/android-bionic/apk-assets/runtime-aot/libbbcpu.so
      - name: Retrieve fixed Android AOT compiler (TSO lowering included)
        uses: actions/download-artifact@v4
        with:
          name: TLOU-bb-recomp-1.3.0-TSO-STR-ARM64
          path: out/aot-tso-compiler
          run-id: '43347558246'
          github-token: ${{ github.token }}
      - name: Verify pinned TSO compiler artifact and archive integrity
        run: |
          set -euo pipefail
          archive=out/aot-tso-compiler/bb-recomp-android-aarch64.tar.xz
          test -s "$archive"
          echo 'fed33b282195034ce0da405b3ad60f513451786c6fda59767344cbedb219e7c0  '"$archive" | sha256sum -c
          (cd out/aot-tso-compiler && sha256sum -c bb-recomp-android-aarch64.tar.xz.sha256)
          mkdir -p out/aot-tso-extract
          tar -xJf "$archive" -C out/aot-tso-extract
          test -s out/aot-tso-extract/android/libbbrecomp.so
          test -s out/aot-tso-extract/android/bundle/libbbcpu-stub.so
          readelf -h out/aot-tso-extract/android/libbbrecomp.so | grep -E 'Machine:.*AArch64'
          grep -aFq '3-tlou-string' out/aot-tso-extract/android/libbbrecomp.so
      - name: Stage exact native game runtime with pinned ARM64 compiler
        run: |
          set -euo pipefail
          apk=out/aot-source-apk/TheLastOfUsRemastered-Android-v0.1.1-arm64.apk
          test -s "$apk"
          python3 - "$apk" <<'PY'
          import hashlib,sys
          from pathlib import Path
          path=Path(sys.argv[1])
          expected=Path(str(path)+'.sha256').read_text().split()[0].lower()
          with path.open('rb') as f:
              digest=hashlib.file_digest(f,'sha256').hexdigest()
          assert digest==expected, f'Native APK SHA mismatch: {digest} != {expected}'
          print('Pinned native APK digest matched')
          PY
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          export TLOU_TSO_REQUIRED=1
          export TLOU_AOT_COMPILER_ARCHIVE="$PWD/out/aot-tso-compiler/bb-recomp-android-aarch64.tar.xz"
          bash android/bionic/stage_aot_compiler.sh
          python3 android/bionic/repackage_local_aot.py "$apk"
      - name: Generate save-selection fixtures for existing Android tests
        run: python3 gow3_pc/tests/test_android_save_choice.py
      - name: Restore pinned AOT v2 signing key (reused on future APKs)
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: tlou-aotnative-development-signing-v1
          fail-on-cache-miss: true
      - name: Verify pinned AOT v2 certificate before build
        run: |
          set -euo pipefail
          test -s "$HOME/.android/debug.keystore"
          expected=adbdd4efd7cb981ce6a30303de83b635800b0960c68276d9247962918cc7328c
          actual=$(keytool -exportcert -alias androiddebugkey \
            -keystore "$HOME/.android/debug.keystore" -storepass android 2>/dev/null | sha256sum | cut -d' ' -f1)
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Debug signer mismatch: this APK would NOT update the AOT v2 experimental app. Refusing build. Found $actual" >&2
            exit 1
          fi
          echo "Pinned AOT signer verified: $actual"
      - name: Build standalone signed debug APK for local AOT compiler testing
        run: gradle -p android-launcher :app:assembleDebug :app:testDebugUnitTest --no-daemon --max-workers=2
      - name: Verify signed APK, distinct app ID and original CPU/GPU binaries
        run: |
          set -euo pipefail
          sdk="$ANDROID_HOME/build-tools/35.0.0"
          apk=android-launcher/app/build/outputs/apk/debug/app-debug.apk
          original=out/aot-source-apk/TheLastOfUsRemastered-Android-v0.1.1-arm64.apk
          "$sdk/apksigner" verify --verbose "$apk"
          "$sdk/apksigner" verify --print-certs "$apk" | grep -F 'adbdd4efd7cb981ce6a30303de83b635800b0960c68276d9247962918cc7328c'
          "$sdk/aapt" dump badging "$apk" | grep "package: name='com.daedalus.tlou.remastered.aotnative2'"
          python3 android/bionic/check_tools_apk.py "$apk"
          python3 - "$original" "$apk" <<'PY'
          import sys,zipfile,hashlib,io
          with zipfile.ZipFile(sys.argv[1]) as a, zipfile.ZipFile(sys.argv[2]) as b:
              preserved=[n for n in a.namelist() if n.startswith(('lib/arm64-v8a/','assets/runtime/','assets/drivers/')) and not n.endswith('/')]
              assert preserved
              for n in preserved:
                  assert hashlib.sha256(a.read(n)).digest()==hashlib.sha256(b.read(n)).digest(),n
              assert b.getinfo('assets/runtime-aot/libgow3cpu.so').file_size>4096
              assert b.getinfo('assets/runtime-aot/libbbcpu.so').file_size>=512
              with zipfile.ZipFile(io.BytesIO(b.read('assets/tools.zip'))) as tools:
                  for n in ['bin/libbbrecomp.so','source/android/aot/aot_local.py','aot/upstream.sha256']:
                      assert tools.getinfo(n).file_size>0
                  compiler=tools.read('bin/libbbrecomp.so')
                  assert tools.read('aot/upstream.sha256').strip()==b'fed33b282195034ce0da405b3ad60f513451786c6fda59767344cbedb219e7c0', 'wrong compiler archive'
                  assert b'3-tlou-string' in compiler, 'VPCMPISTRX compiler missing: no APK can be published'
              print('Verified',len(preserved),'unchanged native/runtime/driver payload files and AOT compiler')
          PY
      - name: Publish installable experimental APK
        uses: actions/upload-artifact@v4
        with:
          name: TLOU-v011-Native-ARM64-AOT-STRING-Fix2-APK
          path: android-launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload diagnostics when compilation fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TLOU-Local-AOT-APK-Errors
          path: android-launcher/app/build/reports/**
          if-no-files-found: ignore
