name: TLOU Stage-B ring cursor CPU A/B
on:
  push:
    branches: ['perf/tlou-ring-cursor-stageb-20261109']
    paths:
      - 'gow3_pc/gpu/shadps4/video_core/renderer_vulkan/ring_binding_cursor.h'
      - 'gow3_pc/tests/test_ring_binding_cursor.cpp'
      - '.github/workflows/tlou-ring-cursor-cost-temp.yml'
      - 'gow3_pc/gpu/shadps4/video_core/renderer_vulkan/vk_rasterizer.cpp'
permissions:
  contents: read
jobs:
  cursor:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Measure actual Stage-B cursor against linear lookup
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            gow3_pc/tests/test_ring_binding_cursor.cpp -o /tmp/cursor
          /tmp/cursor --cost-gate
      - name: ASan UBSan exact pointer parity
        run: |
          g++ -std=c++20 -O1 -g -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            gow3_pc/tests/test_ring_binding_cursor.cpp -o /tmp/cursor-sanitized
          /tmp/cursor-sanitized --correctness-only
