name: TLOU one-time full-history signing file scan
on:
  push:
    branches: [tlou-ui-approval-log32-20261105]
    paths:
      - '.github/workflows/tlou-cache-inventory-once.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  history-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Search every reachable Git object for old keystores and creation scripts
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --quiet
          echo '--- Reachable branches and commits ---'
          echo "branches=$(git branch -r | wc -l)"
          echo "commits=$(git rev-list --all --count)"
          echo '--- Historical named key objects (paths only; no secrets) ---'
          git rev-list --objects --all | grep -Ei '(^|/)[^/]+\.(jks|keystore|p12|pfx)$|(^|/)[^/]*(signing-backup|key-backup)[^/]*$' || true
          echo '--- Commits mentioning key generation or alternative backup paths ---'
          git log --all --format='%h %ad %s' --date=short --regexp-ignore-case --grep='keystore\|signing.key\|signing identity\|private key' | head -60 || true
          echo '--- Referenced keystore paths in source (filenames only) ---'
          git grep -il 'experimental-development.jks\|tlou-development-signing-v2' $(git for-each-ref --format='%(refname)' refs/remotes/origin/ | head -70) 2>/dev/null | cut -d: -f2- | sort -u | head -60 || true
