name: TLOU one-time APK versus cached AOT signing cert check
on:
  push:
    branches: [experiment/tlou-local-aot-20261112]
    paths:
      - '.github/workflows/tlou-signer-cert-compare-once.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    steps:
      - name: Restore alternate AOT signing identity
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: tlou-aotnative-development-signing-v1
          fail-on-cache-miss: true
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;35.0.0'
      - name: Compare public signing certificates without exposing private keys
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apkcheck
          gh release download v0.1.1-android-bionic -p 'TheLastOfUsRemastered-Android-v0.1.1-arm64.apk' -D apkcheck
          apk=$(find apkcheck -name '*.apk' -print -quit)
          test -s "$apk"
          old=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          alternate=$(keytool -exportcert -alias androiddebugkey -keystore "$HOME/.android/debug.keystore" -storepass android 2>/dev/null | sha256sum | cut -d' ' -f1)
          echo "ORIGINAL_V011_APK_CERT_SHA256=$old"
          echo "ALTERNATE_AOT_CACHE_CERT_SHA256=$alternate"
          test -n "$old"
          test -n "$alternate"
          if [[ "$old" == "$alternate" ]]; then
            echo 'SIGNATURE_MATCH=YES_COMPATIBLE'
          else
            echo 'SIGNATURE_MATCH=NO_DIFFERENT_PRIVATE_KEY'
          fi
