name: TLOU one-time signer archive candidate scan
on:
  push:
    branches: [tlou-ui-approval-log32-20261105]
    paths: ['.github/workflows/tlou-signer-artifact-audit-once.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Scan small historical job artifact archives for original key backups
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess, json, io, zipfile, re, os, time
          repo=os.environ['GH_REPO']
          arts=[]
          for page in range(1,30):
              x=subprocess.run(['gh','api',f'repos/{repo}/actions/artifacts?per_page=100&page={page}'],capture_output=True,text=True)
              if x.returncode!=0: print('LIST_ERROR',x.stderr[:250]);break
              d=json.loads(x.stdout)['artifacts']
              arts+=d
              if len(d)<100:break
          selected=[a for a in arts if a.get('size_in_bytes',0)<=1200000 and not a.get('expired',True)]
          selected.sort(key=lambda a:(0 if any(t in a['name'].lower() for t in ('diagnos','error','native','backup','sign','source')) else 1,a['created_at']))
          print('ARTIFACTS_SELECTED',len(selected))
          print('ARCHIVES_WITH_KEY_FILE_NAMES')
          count=success=fail=0
          for a in selected:
              count+=1
              run=subprocess.run(['gh','api',f'repos/{repo}/actions/artifacts/{a["id"]}/zip'],capture_output=True,timeout=50)
              if run.returncode:
                  fail+=1
                  if fail<=5:print('ARCHIVE_DOWNLOAD_ERROR',a['id'],run.stderr[:150].decode(errors='replace'))
                  continue
              try:
                  z=zipfile.ZipFile(io.BytesIO(run.stdout))
                  names=z.namelist()
                  matching=[x for x in names if re.search(r'(^|/)[^/]+\.(jks|keystore|p12|pfx|pem|key)$',x,re.I) or 'experimental-development' in x.lower()]
                  if matching:
                      print('KEY_NAME_CANDIDATE',a['id'],repr(a['name']),repr(matching[:20]))
                  success+=1
              except Exception as e:
                  fail+=1
                  if fail<=5:print('ARCHIVE_BAD_ZIP',a['id'],str(e)[:120])
              if count%40==0:print('SCAN_PROGRESS',count,'success',success,'failed',fail)
          print('SCAN_FINAL',count,'success',success,'failed',fail)
          PY
