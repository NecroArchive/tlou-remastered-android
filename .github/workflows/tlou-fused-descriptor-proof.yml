name: TLOU Fused Vulkan Recorder Proof
on:
  push:
    branches: [experiment/tlou-fused-descriptor-record-20261114]
    paths:
      - '.github/workflows/tlou-fused-descriptor-proof.yml'
      - 'gow3_pc/gpu/shadps4/video_core/renderer_vulkan/vk_pipeline_common.cpp'
      - 'gow3_pc/gpu/shadps4/video_core/renderer_vulkan/tlou_buffer_descriptor_template.h'
      - 'gow3_pc/tests/test_tlou_fused_vk_record.cpp'
      - 'gow3_pc/tests/test_tlou_buffer_descriptor_vulkan.cpp'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recorder-proof:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install native Vulkan software ICD, validation and shaders
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers glslang-tools
      - name: Check recorder order and synthetic queue cost on this CPU
        run: |
          set -euo pipefail
          mkdir -p out/fused-proof
          c++ -std=c++20 -O2 -UNDEBUG -Wall -Wextra -Werror gow3_pc/tests/test_tlou_fused_vk_record.cpp -o out/fused-proof/record-test
          out/fused-proof/record-test | tee out/fused-proof/record.txt
          grep -q 'TLOU recorder fusion synthetic' out/fused-proof/record.txt
      - name: Build and verify real Vulkan compute pixels for all three paths
        run: |
          set -euo pipefail
          python3 gow3_pc/tests/build_tlou_buffer_descriptor_shaders.py out/fused-proof/shaders
          c++ -std=c++20 -O2 -UNDEBUG -Wall -Wextra -Werror -Wno-missing-field-initializers -Wno-unknown-pragmas -Wno-unused-value -I gow3_pc/gpu/shadps4 gow3_pc/tests/test_tlou_buffer_descriptor_vulkan.cpp -lvulkan -o out/fused-proof/vulkan-test
          export VK_ICD_FILENAMES=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$VK_ICD_FILENAMES"
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation VK_LAYER_ENABLES=VK_VALIDATION_FEATURE_ENABLE_SYNCHRONIZATION_VALIDATION_EXT out/fused-proof/vulkan-test out/fused-proof/shaders --correctness-only > out/fused-proof/vulkan.txt 2>&1
          cat out/fused-proof/vulkan.txt
          if grep -E 'Validation Error|VUID-|SYNC-HAZARD' out/fused-proof/vulkan.txt; then exit 1; fi
          grep -q 'legacy/template/fused outputs PASS' out/fused-proof/vulkan.txt
          grep -q 'GRAPHICS PIXELS buffers=16' out/fused-proof/vulkan.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TLOU-Fused-Descriptor-Proof-${{ matrix.runner }}
          path: out/fused-proof/*.txt
          if-no-files-found: warn
