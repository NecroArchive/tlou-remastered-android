name: TLOU ADPF monotonic frame report ARM64 x86 validation
on:
  push:
    branches: [fix/tlou-adpf-frame-report-20261110]
    paths: [gow3_pc/**, .github/workflows/tlou-adpf-frame-validation.yml]
permissions:
  contents: read
jobs:
  adpf-frame:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run production ADPF monotonic frame helper
        run: |
          g++ -std=c++20 -O2 -UNDEBUG -Wall -Wextra -Werror \
            -I gow3_pc/gpu/shadps4 \
            gow3_pc/tests/test_tlou_adpf_frame_progress.cpp -o /tmp/tlou-adpf-test
          /tmp/tlou-adpf-test
      - name: Verify real native ADPF header links on ARM64 and x86
        run: |
          cat >/tmp/adpf-header.cpp <<'CPP'
          #include "video_core/renderer_vulkan/tlou_adpf.h"
          int main() {
              Vulkan::Detail::TlouAdpfCommandHint hint;
              for(unsigned i=0;i<30000;++i)hint.NotePostDraw(i/300);
          }
          CPP
          g++ -std=c++20 -O2 -D__ANDROID__ -Wall -Wextra -Werror \
            -I gow3_pc/gpu/shadps4 /tmp/adpf-header.cpp -ldl \
            -o /tmp/adpf-header-test
          GOW3_ADPF=1 /tmp/adpf-header-test
      - name: Check sanitizer correctness of monotonic frame progress
        run: |
          g++ -std=c++20 -O1 -g -UNDEBUG -fsanitize=address,undefined \
            -fno-omit-frame-pointer -Wall -Wextra -Werror \
            -I gow3_pc/gpu/shadps4 \
            gow3_pc/tests/test_tlou_adpf_frame_progress.cpp \
            -o /tmp/tlou-adpf-sanitize
          /tmp/tlou-adpf-sanitize
