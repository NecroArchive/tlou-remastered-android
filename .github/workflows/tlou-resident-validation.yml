name: TLOU residency full hit equivalence + ARM64 benchmark
on:
  push:
    branches: [perf/tlou-resident-fast-path-20261110]
    paths: [gow3_pc/**, .github/workflows/tlou-resident-validation.yml]
permissions:
  contents: read
jobs:
  residency:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile and benchmark residency interval lookup with real interval code
        run: |
          g++ -std=c++20 -O3 -UNDEBUG -Wall -Wextra -Werror \
            -I gow3_pc/gpu/shadps4 \
            gow3_pc/tests/test_tlou_resident_full_hit.cpp -o /tmp/tlou-resident
          /tmp/tlou-resident
      - name: Verify sanitizer interval coverage invariants
        run: |
          g++ -std=c++20 -O1 -g -UNDEBUG \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I gow3_pc/gpu/shadps4 \
            gow3_pc/tests/test_tlou_resident_full_hit.cpp -o /tmp/tlou-resident-asan
          /tmp/tlou-resident-asan
