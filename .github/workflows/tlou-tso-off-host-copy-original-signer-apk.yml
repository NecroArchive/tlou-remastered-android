name: TLOU Complete ARM64 Patch Variants AOT - Original Signer

on:
  push:
    branches: [experiment/tlou-local-aot-20261112]
    paths:
      - '.github/workflows/tlou-tso-off-host-copy-original-signer-apk.yml'
      - 'gow3_pc/gpu/shim/vk_driver_loader.cpp'
      - 'gow3_pc/gpu/shadps4/video_core/renderer_vulkan/vk_compute_pipeline.cpp'
      - 'gow3_pc/tests/test_tlou_qualcomm_vulkan_fallback.cpp'
      - 'android/tlou_patches.py'
      - 'android/tests/test_tlou_111_optional_light_shadows.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# This workflow runs in the ORIGINAL SIGNING CACHE branch, so it can restore
# the exact existing debug keystore. No new key is generated.
# Builds the current signed APK branch and compiles its actual Vulkan GPU from HEAD.
# Original signing cache stays in the original branch, no private keys uploaded.
# Only the original proven AOT v3 backend is packaged. The frontend omits --tso.
# Restart after GitHub Actions re-enabled on 2026-11-17; original signer required.
concurrency:
  group: tlou-tso-off-host-copy-batch-original-signer
  cancel-in-progress: false

jobs:
  gpu:
    name: Build updated Vulkan GPU from the same commit as the APK
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      TLOU_JOBS: '3'
      TLOU_ANDROID_API: '30'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Confirm actual branch HEAD instead of old pinned source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "Building GPU from $GITHUB_SHA"
      - name: Test external Qualcomm vendor fallback without masking Turnip failure
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan1
          c++ -std=c++20 -O2 -Wall -Wextra -Werror \
            gow3_pc/tests/test_tlou_qualcomm_vulkan_fallback.cpp \
            gow3_pc/gpu/shim/vk_driver_loader.cpp -ldl -o /tmp/tlou-qualcomm-fallback
          /tmp/tlou-qualcomm-fallback vendor 2>&1 | tee /tmp/tlou-qualcomm-vendor.log
          /tmp/tlou-qualcomm-fallback turnip 2>&1 | tee /tmp/tlou-turnip-failure.log
          /tmp/tlou-qualcomm-fallback system 2>&1 | tee /tmp/tlou-system-vulkan.log
          grep -Fq 'SYSTEM Qualcomm driver instead' /tmp/tlou-qualcomm-vendor.log
          ! grep -Fq 'SYSTEM Qualcomm driver instead' /tmp/tlou-turnip-failure.log
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;29.0.14206865'
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: ci/environment.yml
          cache-environment: true
          init-shell: bash
      - name: Restore Bionic dependencies and native compiler cache
        uses: actions/cache@v4
        with:
          path: |
            .local-deps/android/bionic-prefix
            .local-deps/android/bionic-src
            .local-deps/android/bionic-build
            .local-deps/FEX
            ~/.cache/ccache
          key: tlou-bionic-arm64-v2-${{ runner.os }}-${{ hashFiles('android/bionic/build_deps.sh', 'android/bionic/build_fex.sh') }}
          restore-keys: |
            tlou-bionic-arm64-v2-${{ runner.os }}-
      - name: Cross-compile updated Bionic Vulkan renderer
        shell: bash -el {0}
        run: |
          set -euo pipefail
          bash ci/setup-deps.sh "$CONDA_PREFIX"
          export TLOU_BIONIC_HEADERS="$CONDA_PREFIX"
          export TLOU_NDK="$ANDROID_HOME/ndk/29.0.14206865"
          bash android/bionic/build_deps.sh
          bash android/bionic/build_gpu.sh
      - name: Verify actual A6xx fix and export SHA256 GPU
        run: |
          set -euo pipefail
          mkdir -p out/native-gpu
          cp out/android-bionic/lib/libgow3gpu.so out/native-gpu/libgow3gpu.so
          readelf -h out/native-gpu/libgow3gpu.so | grep -E 'Machine:.*AArch64'
          for marker in 'GOW3_STAGING_PREWARM_BLOCKS' 'GPU allocation failure:' 'SYSTEM Qualcomm driver instead' 'host-copy items=' 'memory-waits-deferred=' 'TLOU compute buffer-only fast' 'TLOU pending word-hit'; do
            grep -aFq "$marker" out/native-gpu/libgow3gpu.so
          done
          (cd out/native-gpu && sha256sum libgow3gpu.so > libgow3gpu.so.sha256 && sha256sum -c libgow3gpu.so.sha256)
          test "$(stat -c %s out/native-gpu/libgow3gpu.so)" -gt 100000
      - uses: actions/upload-artifact@v4
        with:
          name: TLOU-Current-Source-ARM64-GPU
          path: out/native-gpu/libgow3gpu.so*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: TLOU-current-GPU-build-failure
          path: |
            out/android-bionic/gpu/CMakeCache.txt
            out/android-bionic/gpu/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore

  apk:
    needs: gpu
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        # Build from this branch's exact triggering commit, never an older ref.
      - name: Confirm current source revision
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "APK source commit $GITHUB_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore pinned AOT v2 signing key (reused on future APKs)
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: tlou-aotnative-development-signing-v1
          fail-on-cache-miss: true
      - name: Verify pinned AOT v2 certificate before build
        run: |
          set -euo pipefail
          test -s "$HOME/.android/debug.keystore"
          expected=adbdd4efd7cb981ce6a30303de83b635800b0960c68276d9247962918cc7328c
          actual=$(keytool -exportcert -alias androiddebugkey \
            -keystore "$HOME/.android/debug.keystore" -storepass android 2>/dev/null | sha256sum | cut -d' ' -f1)
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Debug signer mismatch: this APK would NOT update the AOT v2 experimental app. Refusing build. Found $actual" >&2
            exit 1
          fi
          echo "Pinned AOT signer verified: $actual"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;29.0.14206865'
      - name: Check local ARM64 AOT preparation
        run: |
          python3 -m py_compile android/aot/aot_local.py android/aot/patch_variants.py android/aot/test_patch_variants.py android/aot/test_aot_local.py android/aot/test_aot_quality.py android/bionic/repackage_local_aot.py android/aot/port_runtime.py
          python3 android/aot/test_aot_local.py -v
          python3 android/aot/test_patch_variants.py -v
          python3 android/aot/test_aot_quality.py -v
          python3 android/aot/test_fiber_tls.py -v
          python3 android/aot/test_aot_fault_probe.py -v
          python3 android/aot/test_aot_signal_stack.py -v
          python3 android/aot/test_aot_host_stack.py -v
          python3 android/aot/test_affinity_preload.py -v
          python3 android/aot/test_affinity_balance_model.py -v
          python3 android/aot/test_tso_one_fence.py -v
          python3 android/aot/test_tso_outlined.py -v
          python3 android/bionic/test_multi_tso_packaging.py -v
          python3 android/aot/test_no_tso_profile.py -v
          python3 android/tests/test_tlou_physical_updates_single_aot.py -v
          javac -d /tmp/tlou-device-policy-test \
            android-launcher/app/src/main/java/ro/cobrabm/fexdroid/TlouDevicePolicy.java \
            android-launcher/app/src/test/java/ro/cobrabm/fexdroid/TlouDevicePolicyTest.java
          java -cp /tmp/tlou-device-policy-test ro.cobrabm.fexdroid.TlouDevicePolicyTest
          cc -std=gnu11 -O2 -pthread -Wall -Wextra -Werror gow3_pc/tests/test_android_cpu_policy.c -o /tmp/tlou-test-cpu-placement
          /tmp/tlou-test-cpu-placement
          c++ -std=c++20 -O2 -Wall -Wextra -Werror gow3_pc/tests/test_tlou_readback_watch_gate.cpp -o /tmp/tlou-test-readback-gate
          /tmp/tlou-test-readback-gate
          c++ -std=c++20 -O2 -UNDEBUG -Wall -Wextra -Werror -I gow3_pc/gpu/shadps4 gow3_pc/tests/test_tlou_compute_drain_policy.cpp -o /tmp/tlou-test-compute-wait-defer
          /tmp/tlou-test-compute-wait-defer
          mkdir -p out/aot-java-test
          javac -d out/aot-java-test android-launcher/app/src/main/java/ro/cobrabm/fexdroid/TlouApp0Assets.java android-launcher/app/src/test/java/ro/cobrabm/fexdroid/TlouApp0AssetsTest.java
          java -cp out/aot-java-test ro.cobrabm.fexdroid.TlouApp0AssetsTest
          javac -d out/aot-java-test android-launcher/app/src/main/java/ro/cobrabm/fexdroid/UpdateInPlace.java android-launcher/app/src/test/java/ro/cobrabm/fexdroid/UpdateInPlaceTest.java
          java -cp out/aot-java-test ro.cobrabm.fexdroid.UpdateInPlaceTest
          javac -d out/aot-java-test android-launcher/app/src/main/java/ro/cobrabm/fexdroid/RuntimeProcess.java android-launcher/app/src/main/java/ro/cobrabm/fexdroid/TlouCpuThreads.java android-launcher/app/src/test/java/ro/cobrabm/fexdroid/TlouCpuThreadsTest.java
          java -cp out/aot-java-test ro.cobrabm.fexdroid.TlouCpuThreadsTest
          javac -d out/aot-java-test android-launcher/app/src/main/java/ro/cobrabm/fexdroid/AotInstrumentation.java android-launcher/app/src/test/java/ro/cobrabm/fexdroid/AotInstrumentationTest.java
          java -cp out/aot-java-test ro.cobrabm.fexdroid.AotInstrumentationTest
      - name: Retrieve successful native ARM64 APK
        uses: actions/download-artifact@v4
        with:
          name: TheLastOfUsRemastered-Android-v0.1.1-arm64
          path: out/aot-source-apk
          run-id: '43315820944'
          github-token: ${{ github.token }}
      - name: Build ARM64 AOT CPU from the current source, including TLOU fiber changes
        env:
          TLOU_NDK: /usr/local/lib/android/sdk/ndk/29.0.14206865
        run: bash android/bionic/build_aot_cpu.sh
      - name: Stage verified alternative AOT CPU, leave production FEX intact
        run: |
          set -euo pipefail
          so=out/android-bionic/aot-backend/libgow3cpu.so
          test -s "$so"
          python3 - "$so" <<'PY'
          import hashlib,sys
          from pathlib import Path
          path=Path(sys.argv[1])
          expected=Path(str(path)+'.sha256').read_text().split()[0]
          assert hashlib.file_digest(path.open('rb'),'sha256').hexdigest()==expected
          PY
          readelf -h "$so" | grep -E 'Machine:.*AArch64'
          readelf --dyn-syms --wide "$so" | grep -F 'pthread_attr_setstacksize'
          grep -aFq 'TLOU AOT host pthread stack' "$so"
          readelf --dyn-syms --wide "$so" | grep -F pthread_setname_np
          grep -aFq 'TLOU CPU placement:' "$so"
          readelf --dyn-syms --wide "$so" | grep -F guest_cpu_fiber_switch
          grep -aFq 'TLOU AOT invalid target' "$so"   # ensure the current traced dispatcher is actually packaged
          grep -aFq 'TLOU AOT fiber TLS preserved' "$so" # ensure cross-thread TLS fix is linked
          readelf -Ws "$so" | grep -Fq 'TlouAotProbeFault' # the compiler may fold the write(2) string
          grep -aFq 'TLOU AOT sceFiberRun' "$so" # require fiber return-code provenance in packaged CPU engine
          grep -aFq 'TLOU AOT job thread entry' "$so" # thread-type and actual TLS provenance
          grep -aFq 'TLOU AOT queue lane' "$so" # confirm the failing queue record is captured
          mkdir -p out/android-bionic/apk-assets/runtime-aot
          cp "$so" out/android-bionic/apk-assets/runtime-aot/libgow3cpu.so
          test -s out/android-bionic/aot-backend/libbbcpu.so
          readelf -d out/android-bionic/aot-backend/libbbcpu.so | grep -F '[libgow3cpu.so]'
          cp out/android-bionic/aot-backend/libbbcpu.so out/android-bionic/apk-assets/runtime-aot/libbbcpu.so
      - name: Retrieve only the pinned ARM64 AOT v3 compiler
        uses: actions/download-artifact@v4
        with:
          name: TLOU-bb-recomp-1.3.0-TSO-STR-ARM64
          path: out/aot-v3-compiler
          run-id: '43347558246'
          github-token: ${{ github.token }}
      - name: Verify pinned ARM64 compiler and single codegen policy
        run: |
          set -euo pipefail
          archive=out/aot-v3-compiler/bb-recomp-android-aarch64.tar.xz
          test -s "$archive"
          (cd out/aot-v3-compiler && sha256sum -c bb-recomp-android-aarch64.tar.xz.sha256)
          mkdir -p out/aot-v3-extract
          tar -xJf "$archive" -C out/aot-v3-extract
          binary=out/aot-v3-extract/android/libbbrecomp.so
          test -s "$binary"
          test -s out/aot-v3-extract/android/bundle/helpers-aarch64.o
          readelf -h "$binary" | grep -E 'Machine:.*AArch64'
          grep -aFq '3-tlou-string' "$binary"
          grep -Fq 'TsoProfile.version(TsoProfile.RELAXED).equals(meta.optString("compiler_version"))' android-launcher/app/src/main/java/ro/cobrabm/fexdroid/RuntimeAot.java
          ! grep -Fq 'Perfil TSO' android-launcher/app/src/main/java/ro/cobrabm/fexdroid/MainActivity.java
          grep -Fq 'RELAXED="off"' android-launcher/app/src/main/java/ro/cobrabm/fexdroid/TsoProfile.java
          grep -Fq 'env.put("GOW3_TLOU_HOST_COPY_BATCH","0")' android-launcher/app/src/main/java/ro/cobrabm/fexdroid/PortSettings.java
          grep -Fq 'if(RuntimeAotExitPolicy.shouldDisableDirectLaunch(' android-launcher/app/src/main/java/ro/cobrabm/fexdroid/GameActivity.java
      - name: Stage exact native game runtime with pinned ARM64 compiler
        run: |
          set -euo pipefail
          apk=out/aot-source-apk/TheLastOfUsRemastered-Android-v0.1.1-arm64.apk
          test -s "$apk"
          python3 - "$apk" <<'PY'
          import hashlib,sys
          from pathlib import Path
          path=Path(sys.argv[1])
          expected=Path(str(path)+'.sha256').read_text().split()[0].lower()
          with path.open('rb') as f:
              digest=hashlib.file_digest(f,'sha256').hexdigest()
          assert digest==expected, f'Native APK SHA mismatch: {digest} != {expected}'
          print('Pinned native APK digest matched')
          PY
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          export TLOU_TSO_REQUIRED=1
          export TLOU_AOT_COMPILER_ARCHIVE="$PWD/out/aot-v3-compiler/bb-recomp-android-aarch64.tar.xz"
          unset TLOU_TSO_MULTI_PROFILE_DIR TLOU_TSO_ALIGNED_AR_EXPERIMENT TLOU_TSO_OUTLINE_UNALIGNED_EXPERIMENT
          bash android/bionic/stage_aot_compiler.sh
          python3 android/bionic/repackage_local_aot.py "$apk"
      - name: Fetch GPU library compiled from THIS source revision
        uses: actions/download-artifact@v4
        with:
          name: TLOU-Current-Source-ARM64-GPU
          path: out/native-gpu
      - name: Replace old pinned libgow3gpu.so in AOT APK staging (keep same package and signing key)
        run: |
          set -euo pipefail
          (cd out/native-gpu && sha256sum -c libgow3gpu.so.sha256)
          original=out/aot-source-apk/TheLastOfUsRemastered-Android-v0.1.1-arm64.apk
          python3 - "$original" <<'PY'
          from pathlib import Path
          import hashlib,sys,zipfile
          new=Path('out/native-gpu/libgow3gpu.so').read_bytes()
          with zipfile.ZipFile(sys.argv[1]) as archive:
              old=archive.read('lib/arm64-v8a/libgow3gpu.so')
          assert new[:4]==b'\x7fELF' and len(new)>100000, 'GPU is not a real ELF'
          assert hashlib.sha256(new).digest()!=hashlib.sha256(old).digest(), 'GPU binary did not change: refuse pointless APK'
          print('Verified changed Bionic GPU:', hashlib.sha256(old).hexdigest()[:16], '->',hashlib.sha256(new).hexdigest()[:16])
          PY
          readelf -h out/native-gpu/libgow3gpu.so | grep -E 'Machine:.*AArch64'
          grep -aFq 'memory-waits-deferred=' out/native-gpu/libgow3gpu.so
          grep -aFq 'TLOU compute buffer-only fast' out/native-gpu/libgow3gpu.so
          grep -aFq 'TLOU pending word-hit' out/native-gpu/libgow3gpu.so
          grep -aFq 'host-copy items=' out/native-gpu/libgow3gpu.so
          grep -aFq 'GOW3_STAGING_PREWARM_BLOCKS' out/native-gpu/libgow3gpu.so
          grep -aFq 'GPU allocation failure:' out/native-gpu/libgow3gpu.so
          grep -aFq 'Qualcomm compute recovered:' out/native-gpu/libgow3gpu.so
          grep -aFq 'SYSTEM Qualcomm driver instead' out/native-gpu/libgow3gpu.so
          cp out/native-gpu/libgow3gpu.so out/android-bionic/apk-jni/arm64-v8a/libgow3gpu.so
      - name: Generate save-selection fixtures for existing Android tests
        run: python3 gow3_pc/tests/test_android_save_choice.py
      - name: Build standalone signed debug APK for local AOT compiler testing
        run: gradle -p android-launcher :app:assembleDebug :app:testDebugUnitTest --no-daemon --max-workers=2
      - name: Verify Adreno740 UBWC, A6xx isolation and 8 GB native policy source before APK signing
        run: |
          set -euo pipefail
          grep -Fq 'TlouDevicePolicy.configureUbwcHint' android-launcher/app/src/main/java/ro/cobrabm/fexdroid/GameActivity.java
          grep -Fq 'TlouDevicePolicy.configureMemory' android-launcher/app/src/main/java/ro/cobrabm/fexdroid/GameActivity.java
          grep -Fq 'turnip_ubwc_hint_mode' android-launcher/app/src/main/java/ro/cobrabm/fexdroid/MainActivity.java
          grep -Fq 'GOW3_STREAM_MB' android-launcher/app/src/main/java/ro/cobrabm/fexdroid/TlouDevicePolicy.java
          grep -Fq 'GOW3_STAGING_KEEP_MB' android-launcher/app/src/main/java/ro/cobrabm/fexdroid/TlouDevicePolicy.java
          grep -Fq 'GOW3_RESIDENCY_CHUNKS' android-launcher/app/src/main/java/ro/cobrabm/fexdroid/TlouDevicePolicy.java
      - name: Verify signed APK, unchanged FEX/CPU and ACTUAL newly built GPU
        run: |
          set -euo pipefail
          sdk="$ANDROID_HOME/build-tools/35.0.0"
          apk=android-launcher/app/build/outputs/apk/debug/app-debug.apk
          original=out/aot-source-apk/TheLastOfUsRemastered-Android-v0.1.1-arm64.apk
          "$sdk/apksigner" verify --verbose "$apk"
          "$sdk/apksigner" verify --print-certs "$apk" | grep -F 'adbdd4efd7cb981ce6a30303de83b635800b0960c68276d9247962918cc7328c'
          "$sdk/aapt" dump badging "$apk" | grep "package: name='com.daedalus.tlou.remastered.aotnative2'"
          python3 android/bionic/check_tools_apk.py "$apk"
          python3 - "$original" "$apk" <<'PY'
          import sys,zipfile,hashlib,io
          with zipfile.ZipFile(sys.argv[1]) as a, zipfile.ZipFile(sys.argv[2]) as b:
              preserved=[n for n in a.namelist() if n.startswith(('lib/arm64-v8a/','assets/runtime/','assets/drivers/')) and not n.endswith('/')]
              assert preserved
              new_gpu=b.read('lib/arm64-v8a/libgow3gpu.so')
              intended=open('out/native-gpu/libgow3gpu.so','rb').read()
              assert new_gpu==intended, 'new GPU not packaged: refusing old renderer'
              assert b'memory-waits-deferred=' in new_gpu, 'Compute memory-wait regression is still in APK'
              assert b'TLOU compute buffer-only fast' in new_gpu, 'Native compute specialization missing from APK'
              assert b'TLOU pending word-hit' in new_gpu, 'Native pending filter missing from APK'
              assert b'host-copy items=' in new_gpu, 'Host-copy grouping diagnostics missing from APK'
              assert b'GOW3_STAGING_PREWARM_BLOCKS' in new_gpu, 'A6xx staging prewarm not built into APK'
              assert b'GPU allocation failure:' in new_gpu, 'Vulkan OOM caller diagnostics missing from APK'
              assert b'SYSTEM Qualcomm driver instead' in new_gpu, 'Native system Qualcomm fallback missing from APK'
              assert b'Qualcomm compute recovered:' in new_gpu, 'Native proprietary Qualcomm compute retry missing from APK'
              assert new_gpu!=a.read('lib/arm64-v8a/libgow3gpu.so'), 'old native GPU still packaged'
              for n in preserved:
                  if n=='lib/arm64-v8a/libgow3gpu.so': continue
                  assert hashlib.sha256(a.read(n)).digest()==hashlib.sha256(b.read(n)).digest(),n
              assert b.getinfo('assets/runtime-aot/libgow3cpu.so').file_size>4096
              assert b.getinfo('assets/runtime-aot/libbbcpu.so').file_size>=512
              with zipfile.ZipFile(io.BytesIO(b.read('assets/tools.zip'))) as tools:
                  for n in ['bin/libbbrecomp.so','source/android/aot/aot_local.py','source/android/aot/patch_variants.py','aot/upstream.sha256']:
                      assert tools.getinfo(n).file_size>0
                  aot_source=tools.read('source/android/aot/aot_local.py')
                  assert b'--no-callee-saved' in aot_source, 'fiber-safe ARM64 recompilation flags not packaged'
                  assert b'reload_after_calls_for_fibers' in aot_source, 'fiber-safe compiler metadata not packaged'
                  compiler=tools.read('bin/libbbrecomp.so')
                  expected_compiler_hash=hashlib.sha256(open('out/aot-v3-compiler/bb-recomp-android-aarch64.tar.xz','rb').read()).hexdigest().encode()
                  assert tools.read('aot/upstream.sha256').strip()==expected_compiler_hash, 'wrong compiler archive'
                  assert b'3-tlou-string' in compiler, 'single v3 compiler missing'
                  assert not any(n.startswith('aot/compilers/') for n in tools.namelist()), 'obsolete compiler profiles packaged'
                  assert tools.getinfo('aot/bundle/helpers-aarch64.o').file_size>1000, 'native helpers missing'
                  for feature in (b'--variants', b'--variant-report', b'bbr_vfuncs',
                                  b'bbr_vunit_count', b'bbr_dirty'):
                      assert feature in compiler, 'Pinned AOT compiler lacks patch variant support: '+repr(feature)
                  assert b'-O2' in compiler, 'AOT compiler lacks LLVM O2'
                  assert b'AOT_111_PERFORMANCE_FLAGS = ("-O2",)' in aot_source, 'Dirty checks needed for variants are disabled'
                  assert b'verify_native_variant_coverage' in aot_source, 'Incomplete patch banks could pass'
                  assert b'--variant-report' in aot_source, 'Variant count is not verified'
                  variants=tools.read('source/android/aot/patch_variants.py')
                  assert b'PROFILE = "tlou-111-variants-v3"' in variants, 'Fixed omni-light variant catalog missing'
                  assert b'("720", "540", "360")' in variants, 'All game resolutions are not packaged'
                  assert b'"omni_light_shadows"' in variants and b'"spot_light_shadows"' in variants, 'ZIP28 light patches unavailable'
                  assert b'tlou-111-llvmO2-native-variants-v1' in aot_source, 'Native patch variant codegen missing'
                  assert b'choices=("off",), default="off"' in aot_source, 'production frontend exposes old AOT profiles'
                  assert b'--granular-funcs' in aot_source, 'No preventive AOT entry coverage in APK'
                  assert b'0x1BF55B' in aot_source, 'ZIP 26 worker jump not included'
                  assert b'granular_risk_entries' in aot_source, 'Saved jump miss parsing not included'
                  assert b'TLOU_111_WORKER_JUMP_HOTSPOTS' in aot_source, 'ZIP 27 regional granular coverage missing'
                  assert b'TLOU_111_WORKER_JUMP_HOTSPOT_STEP = 1' in aot_source, 'Sparse jump coverage can miss short worker functions'
                  assert b'0x1C28AD' in aot_source, 'ZIP27 missed native entry not seeded'
                  assert b'select_compile_workers' in aot_source, 'low RAM AOT worker cap missing'
                  assert b'TLOU_111_WORKER_JUMP_HOTSPOT_STEP = 1' in aot_source, 'complete AOT worker target coverage missing'
                  assert b'--tso-profile' in aot_source, 'single ARM64 compile policy missing'
                  assert b'guest_flags = native_guest_flags(args.tso_profile)' in aot_source, 'AOT TSO switching is not wired'
                  assert b'relaxed_ARM64_no_TSO_UNSAFE' in aot_source, 'AOT relaxed memory model not identified'
              print('Verified',len(preserved)-1,'unchanged native/runtime/driver files; new GPU rebuilt and AOT compiler pinned')
          PY
      - name: Publish installable experimental APK
        uses: actions/upload-artifact@v4
        with:
          name: TLOU-v011-Complete-AOT-Patch-Variants-APK
          path: android-launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload diagnostics when compilation fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TLOU-Local-AOT-APK-Errors
          path: android-launcher/app/build/reports/**
          if-no-files-found: ignore
