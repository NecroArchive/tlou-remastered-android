name: Correct TLOU v0.2.0 draft release Markdown
on:
  push:
    branches: [tlou-v020-from-stable-011]
    paths:
      - '.github/workflows/tlou-v020-release-draft-markdown-fix.yml'
permissions:
  contents: write
jobs:
  fix-draft:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify and correct existing DRAFT release notes only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/449994244" --jq '[.tag_name, .draft] | @tsv' > /tmp/release-identity
          test "$(cat /tmp/release-identity)" = "$(printf '0.2.0-android-bionic\ttrue')"
          cat > /tmp/notes.md <<'RELEASE_MD'
# The Last of Us Remastered — Daedalus Android v0.2.0

This update introduces native ARM64 compilation, improved controls, and several bug fixes.

### What's New

- Native ARM64 (AOT) compilation, required before launching the game.
- Improved touch controls with adjustable button sizes and positioning.
- Added flashlight shake support through an on-screen button and L3 + R3 on physical controllers.
- Various stability, rendering, and interface bug fixes.
- Two new graphics patches for game version 1.11: **Disable Omni Light Shadows** and **Disable Spotlight Shadows**.

### Credits & References

**Android fork:** [erickmendes22](https://github.com/erickmendes22) / [Daedalus Emulator](https://www.youtube.com/@daedalusemulator).

**Based on:** [ravencaio/tlou-remastered-pc](https://github.com/ravencaio/tlou-remastered-pc), with credits to all upstream contributors.

**Upstream projects:** [shadPS4](https://github.com/shadps4-emu/shadPS4) · [Bloodborne-Android](https://github.com/ducvd89/Bloodborne-Android) · [Daedalus GoW3](https://github.com/erickmendes22/gow3_android_daedalus_fork) · [fexdroid](https://github.com/cobrabm12/fexdroid) · [libadrenotools](https://github.com/bylaws/libadrenotools) · [Turnip driver releases](https://github.com/StevenMXZ/Adreno-Tools-Drivers/releases).
RELEASE_MD
          jq -n --rawfile body /tmp/notes.md '{body:$body}' > /tmp/update.json
          gh api -X PATCH "repos/$GH_REPO/releases/449994244" --input /tmp/update.json --jq '{tag_name,draft,body}'
          echo "Correct Markdown rendering saved to existing DRAFT without publishing or altering assets."
