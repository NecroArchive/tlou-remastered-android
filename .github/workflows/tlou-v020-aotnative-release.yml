name: TLOU 0.2.0 AOTNative v2 APK (release source, original signer)
# Build signed recorder wait attribution revision 559da2e9828fc3fa79b2ffbbf7467346d5fa03f1.
on:
  push:
    branches: [experiment/tlou-local-aot-20261112]
    paths:
      - '.github/workflows/tlou-v020-aotnative-release.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: tlou-v020-aotnative-original-signer
  # Superseded runs build stale release source and unnecessarily block the APK.
  # The source signing key is restored read-only and remains unchanged.
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      TLOU_JOBS: '3'
      TLOU_ANDROID_API: '30'
      TLOU_CPU_BACKEND: 'aot'
    steps:
      - name: Checkout the EXACT v0.2.0 RELEASE branch, not experimental application code
        uses: actions/checkout@v4
        with:
          ref: perf/tlou-recorder-copy-sites-20261126
          submodules: recursive
      - name: Record source revision and reject a misrouted release
        run: |
          set -euo pipefail
          echo "V020_RELEASE_SOURCE_COMMIT=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "559da2e9828fc3fa79b2ffbbf7467346d5fa03f1"
          grep -Fq 'TLOU readback wake:' gow3_pc/gpu/shadps4/video_core/amdgpu/liverpool.cpp
          grep -Fq 'env.put("GOW3_READBACK_WAKE","1")' android-launcher/app/src/main/java/ro/cobrabm/fexdroid/PortSettings.java
          grep -Fq 'TLOU recorder wait site (5 s):' gow3_pc/gpu/shadps4/video_core/renderer_vulkan/vk_scheduler.cpp
          bash -n android/bionic/package_aotnative_v020.sh
          grep -Fq 'TLOU Qualcomm: verified selected ICD mapped' gow3_pc/gpu/shadps4/video_core/renderer_vulkan/vk_instance.cpp
          grep -Fq 'readback.tick >= watch_tick' gow3_pc/gpu/shadps4/video_core/buffer_cache/buffer_cache.cpp
          ! grep -Fq 'TLOU_QUALCOMM_PRESENT_ROTATE' gow3_pc/gpu/shadps4/video_core/renderer_vulkan/vk_presenter.cpp
          grep -Fq 'single_graphics_queue ? 1u' gow3_pc/gpu/shadps4/video_core/renderer_vulkan/vk_instance.cpp
          grep -Fq 'PublishCompleted(gpu_tick, tick)' gow3_pc/gpu/shadps4/video_core/renderer_vulkan/vk_semaphore.cpp
          grep -Fq 'TLOU draw queue (5 s)' gow3_pc/gpu/shadps4/video_core/renderer_vulkan/vk_scheduler.cpp
          grep -Fq 'TLOU_DRIVER_WAIT_PROFILE' gow3_pc/gpu/shadps4/video_core/renderer_vulkan/vk_scheduler.cpp
          grep -Fq 'applyScreenOrientation' android-launcher/app/src/main/java/ro/cobrabm/fexdroid/GameActivity.java
          test "$(git branch --show-current)" = "perf/tlou-recorder-copy-sites-20261126"
          grep -Fq "versionName '0.2.0'" android-launcher/app/build.gradle
          grep -Fq "applicationIdSuffix '.aotnative2'" android-launcher/app/build.gradle
          test -s android/bionic/package_aotnative_v020.sh
          # Verify the final v0.2.0 code cleanup is in THIS release build,
          # not just the earlier AOT-only linker change.
          grep -Fq 'tlou-aot-native-launcher' android-launcher/app/src/main/java/ro/cobrabm/fexdroid/GameActivity.java
          ! grep -Fq 'FEX_APP_CONFIG_LOCATION' android-launcher/app/src/main/java/ro/cobrabm/fexdroid/GameActivity.java
          grep -Fq 'TLOU_CPU_BACKEND' android/bionic/build_runtime.sh
      - name: Restore exact EXISTING AOTNative v2 private signing identity
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: tlou-aotnative-development-signing-v1
          restore-keys: |
            tlou-aotnative-v2-signer-backup-20261118-a
            tlou-aotnative-v2-signer-backup-20261118-b
          fail-on-cache-miss: true
      - name: Certify signer; never auto-create a debug key
        run: |
          set -euo pipefail
          test -s "$HOME/.android/debug.keystore"
          cert=$(keytool -exportcert -alias androiddebugkey -keystore "$HOME/.android/debug.keystore" -storepass android 2>/dev/null | sha256sum | cut -d ' ' -f1)
          test "$cert" = "adbdd4efd7cb981ce6a30303de83b635800b0960c68276d9247962918cc7328c" || {
            echo "::error::AOTNative v2 signer mismatch; no new identity may be shipped"; exit 8;
          }
          echo "Original AOTNative v2 signer verified; private key stays inside GitHub Actions caches"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
          cache-read-only: true
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;29.0.14206865'
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: ci/environment.yml
          cache-environment: false
          init-shell: bash
      - name: Test CPU, patches, control and game preparation contracts
        shell: bash -el {0}
        run: |
          set -euo pipefail
          python3 -m pip install unicorn==2.1.4
          bash android/bionic/test_runtime_contracts.sh
          python3 -m unittest discover -s android/tests -v
          python3 gow3_pc/tests/test_srt_arm64.py -v
          c++ -std=c++20 -O2 -Wall -Wextra -Werror gow3_pc/tests/test_tlou_eop_batch_policy.cpp -o /tmp/test_tlou_eop_batch_policy
          /tmp/test_tlou_eop_batch_policy
          c++ -std=c++20 -O2 -Wall -Wextra -Werror gow3_pc/tests/test_tlou_qualcomm_dead_int_decls.cpp -o /tmp/test_tlou_qualcomm_dead_int_decls
          /tmp/test_tlou_qualcomm_dead_int_decls
          grep -Fq 'StripCapturedStorageAliases' gow3_pc/gpu/shadps4/video_core/renderer_vulkan/vk_graphics_pipeline.cpp
          grep -Fq 'work_semaphore.NoteAvoidedRefresh()' gow3_pc/gpu/shadps4/video_core/renderer_vulkan/vk_scheduler.h
          grep -Fq 'Qualcomm graphics legalization:' gow3_pc/gpu/shadps4/video_core/renderer_vulkan/vk_graphics_pipeline.cpp
          grep -Fq 'i < 128' gow3_pc/gpu/shadps4/video_core/renderer_vulkan/tlou_host_copy_wait.h
          grep -Fq 'const bool need_refresh' gow3_pc/gpu/shadps4/video_core/buffer_cache/buffer_cache.cpp
          grep -Fq 'i<12' android-launcher/app/src/main/java/ro/cobrabm/fexdroid/RunLog.java
          grep -Fq 'RunLog.rotateShaderCaptures(this)' android-launcher/app/src/main/java/ro/cobrabm/fexdroid/GameActivity.java
          grep -Fq 'gpu_write_window_shift = 16' gow3_pc/gpu/shadps4/video_core/buffer_cache/buffer_cache.cpp
          grep -Fq 'QualcommDeadIntDecls::Strip' gow3_pc/gpu/shadps4/video_core/renderer_vulkan/vk_graphics_pipeline.cpp
          grep -Fq '!BackgroundWarmupActive()' gow3_pc/gpu/shadps4/video_core/renderer_vulkan/vk_pipeline_cache.cpp
          grep -Fq 'WaitForHostCopySequence(host_copies_done, order.host_copies)' gow3_pc/gpu/shadps4/video_core/renderer_vulkan/vk_scheduler.cpp
          grep -Fq 'SubmitDeferredReadbacks(rasterizer, false)' gow3_pc/gpu/shadps4/video_core/amdgpu/liverpool.cpp
          grep -Fq 'SubmitDeferredReadbacks(rasterizer, true)' gow3_pc/gpu/shadps4/video_core/amdgpu/liverpool.cpp
          grep -Fq '0x5e58a2cd42355ca8ull' gow3_pc/gpu/shadps4/video_core/renderer_vulkan/vk_graphics_pipeline.cpp
      - name: Restore pinned Bionic native dependencies read-only
        uses: actions/cache/restore@v4
        with:
          path: |
            .local-deps/android/bionic-prefix
            .local-deps/android/bionic-src
            .local-deps/android/bionic-build
            .local-deps/FEX
            ~/.cache/ccache
          key: tlou-bionic-arm64-v2-${{ runner.os }}-${{ hashFiles('android/bionic/build_deps.sh', 'android/bionic/build_fex.sh') }}
      - name: Set native cross-compiler environment
        shell: bash -el {0}
        run: |
          bash ci/setup-deps.sh "$CONDA_PREFIX"
          echo "TLOU_BIONIC_HEADERS=$CONDA_PREFIX" >> "$GITHUB_ENV"
          echo "TLOU_NDK=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - name: Restore completed native AOT/Vulkan/preparer outputs (for Gradle retry)
        id: native_payload
        uses: actions/cache/restore@v4
        with:
          path: out/android-bionic
          key: tlou-native-aotnative-v020-v2-${{ hashFiles('gow3_pc/**', 'android/bionic/**', 'android/aot/**', 'android/tlou_bionic.py', 'android/tlou_patches.py', 'android/device_prepare.py', 'tools/probe_tlou.py') }}
      - name: Build current Bionic dependency libraries
        if: steps.native_payload.outputs.cache-hit != 'true'
        shell: bash -el {0}
        run: bash android/bionic/build_deps.sh
      - name: Build real ARM64 AOT CPU (never build or stage FEX CPU)
        if: steps.native_payload.outputs.cache-hit != 'true'
        shell: bash -el {0}
        run: |
          set -euo pipefail
          bash android/bionic/build_aot_cpu.sh
          mkdir -p out/android-bionic/lib
          cp out/android-bionic/aot-backend/libgow3cpu.so out/android-bionic/lib/libgow3cpu.so
          cp "$TLOU_NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" out/android-bionic/lib/
          cmp out/android-bionic/aot-backend/libgow3cpu.so out/android-bionic/lib/libgow3cpu.so
      - name: Build source-native Vulkan renderer
        if: steps.native_payload.outputs.cache-hit != 'true'
        shell: bash -el {0}
        run: |
          bash android/bionic/build_gpu.sh --configure-only
          bash android/bionic/build_gpu.sh
      - name: Link the actual native TLOU executable AGAINST AOT CPU
        if: steps.native_payload.outputs.cache-hit != 'true'
        shell: bash -el {0}
        run: bash android/bionic/build_runtime.sh --link-only
      - name: Restore Python / Rust tooling read-only
        if: steps.native_payload.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            .local-deps/android/bionic-src/python-3.13.7
            .local-deps/android/bionic-build/python-host-isolated-v1
            .local-deps/android/bionic-build/python-android-isolated-v1
            out/android-bionic/python
            out/android-bionic/orbis-cargo
            ~/.cargo/registry
            ~/.cargo/git
          key: tlou-install-tools-v1-${{ hashFiles('android/bionic/build_python.sh', 'android/bionic/build_pkg.sh') }}
      - name: Build current on-phone game preparer and PKG installer
        if: steps.native_payload.outputs.cache-hit != 'true'
        shell: bash -el {0}
        run: |
          bash android/bionic/build_python.sh
          bash android/bionic/build_pkg.sh
      - name: Retrieve immutable tested ARM64 TSO v3 compiler, no large LLVM cache created
        if: steps.native_payload.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: TLOU-bb-recomp-1.3.0-TSO-STR-ARM64
          path: out/android-bionic/aot-tso-compiler
          run-id: '43347558246'
          github-token: ${{ github.token }}
      - name: Verify pinned ARM64 patched TSO compiler (mandatory, no fallback)
        if: steps.native_payload.outputs.cache-hit != 'true'
        shell: bash -el {0}
        run: |
          set -euo pipefail
          archive=out/android-bionic/aot-tso-compiler/bb-recomp-android-aarch64.tar.xz
          test -s "$archive"
          echo "fed33b282195034ce0da405b3ad60f513451786c6fda59767344cbedb219e7c0  $archive" | sha256sum -c
          export TLOU_TSO_REQUIRED=1
          export TLOU_AOT_COMPILER_ARCHIVE="$PWD/$archive"
          bash android/bionic/stage_aot_compiler.sh
          grep -aFq '3-tlou-string' out/android-bionic/aot-compiler/bin/libbbrecomp.so
      - name: Cache complete native payload before Gradle/network steps
        if: steps.native_payload.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out/android-bionic
          key: tlou-native-aotnative-v020-v2-${{ hashFiles('gow3_pc/**', 'android/bionic/**', 'android/aot/**', 'android/tlou_bionic.py', 'android/tlou_patches.py', 'android/device_prepare.py', 'tools/probe_tlou.py') }}
      - name: Verify full native binary and application source identity
        shell: bash -el {0}
        run: |
          python3 android/bionic/verify_bionic.py --ndk "$TLOU_NDK" --root out/android-bionic
          cmp out/android-bionic/lib/libgow3cpu.so out/android-bionic/aot-backend/libgow3cpu.so
          gradle -p android-launcher :app:testDebugUnitTest :app:lintVitalRelease --no-daemon --max-workers=2
      - name: Package 0.2.0 with AOTNative v2 package and ORIGINAL debug signing certificate
        shell: bash -el {0}
        run: bash android/bionic/package_aotnative_v020.sh
      - name: Publish verified installable v0.2.0 AOTNative APK
        uses: actions/upload-artifact@v4
        with:
          name: TheLastOfUsRemastered-Android-v0.2.0-AOTNative-v2-arm64
          path: |
            out/release/TheLastOfUsRemastered-Android-v0.2.0-AOTNative-v2-arm64.apk
            out/release/TheLastOfUsRemastered-Android-v0.2.0-AOTNative-v2-arm64.apk.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Upload native build errors and tests only, never the private signer
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TLOU-v020-AOTNative-release-failure
          path: |
            .local-deps/android/bionic-build/**/*.log
            out/android-bionic/gpu/CMakeFiles/CMakeConfigureLog.yaml
            out/android-bionic/gpu/CMakeCache.txt
            android-launcher/app/build/reports/**
          if-no-files-found: ignore
