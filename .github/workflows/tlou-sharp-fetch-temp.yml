name: TLOU SRT 16-byte direct SharpFetch CPU A/B
on:
  push:
    branches: [perf/tlou-lazy-write-index-20261109]
    paths:
      - 'gow3_pc/gpu/shadps4/shader_recompiler/resource.h'
      - 'gow3_pc/tests/test_tlou_sharp_fetch_fast.cpp'
      - '.github/workflows/tlou-sharp-fetch-temp.yml'
permissions:
  contents: read
jobs:
  sharp:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - name: Install production shader header dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libboost-dev libspdlog-dev libfmt-dev libvulkan-dev
      - name: CPU cost gate and exact production SharpFetch parity
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -Wno-unused-parameter -Wno-unused-variable -Wno-reorder -Wno-class-memaccess -pthread \
            -I gow3_pc/tests/native-shim -I gow3_pc/gpu/shadps4 -I gow3_pc/gpu/shim \
            gow3_pc/tests/test_tlou_sharp_fetch_fast.cpp -o /tmp/sharp-fast
          /tmp/sharp-fast --cost-gate
      - name: Sanitized parity across mixed descriptors
        run: |
          set -euo pipefail
          g++ -std=c++20 -O1 -g -Wall -Wextra -Werror -Wno-unused-parameter -Wno-unused-variable -Wno-reorder -Wno-class-memaccess -pthread \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I gow3_pc/tests/native-shim -I gow3_pc/gpu/shadps4 -I gow3_pc/gpu/shim \
            gow3_pc/tests/test_tlou_sharp_fetch_fast.cpp -o /tmp/sharp-fast-sanitized
          /tmp/sharp-fast-sanitized --correctness-only
