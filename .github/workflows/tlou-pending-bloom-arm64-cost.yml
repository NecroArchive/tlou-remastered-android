name: TLOU pending write bloom CPU A/B (no APK)
on:
  push:
    branches:
      - perf/tlou-cpu-pending-filter-arm64-20261108
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Benchmark exact production helper vs old loop
        run: |
          set -euo pipefail
          mkdir -p out/bloom-cost
          uname -m | tee out/bloom-cost/arch.txt
          g++ -std=c++20 -O3 -Wall -Wextra -Werror -I gow3_pc/gpu/shadps4 \
            gow3_pc/tests/test_tlou_pending_bloom_words.cpp -o out/bloom-cost/pending-bloom
          out/bloom-cost/pending-bloom | tee out/bloom-cost/result.txt
          out/bloom-cost/pending-bloom | tee out/bloom-cost/repeat.txt
      - name: ASAN and UB correctness (no speed comparison)
        run: |
          set -euo pipefail
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -g -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I gow3_pc/gpu/shadps4 \
            gow3_pc/tests/test_tlou_pending_bloom_words.cpp -o /tmp/bloom-sanitized
          /tmp/bloom-sanitized --correctness-only
      - uses: actions/upload-artifact@v4
        with:
          name: bloom-cpu-${{ matrix.os }}
          path: out/bloom-cost/*.txt
          if-no-files-found: error
