name: TLOU constant ring capacity ARM64 x86 tests
on:
  push:
    branches: [perf/tlou-constant-ring-capacity-20261109]
    paths: [gow3_pc/**, .github/workflows/tlou-ring-capacity-validation.yml]
permissions:
  contents: read
jobs:
  capacity-parity:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate 32/64/128 MiB ring wrap and GPU retirement
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -I gow3_pc/gpu/shadps4 \
            gow3_pc/tests/test_tlou_constant_ring_capacity.cpp \
            -o /tmp/tlou-ring-capacity
          /tmp/tlou-ring-capacity
      - name: UB and address sanitizer
        run: |
          g++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Wall -Wextra -Werror -I gow3_pc/gpu/shadps4 \
            gow3_pc/tests/test_tlou_constant_ring_capacity.cpp \
            -o /tmp/tlou-ring-capacity-asan
          /tmp/tlou-ring-capacity-asan
