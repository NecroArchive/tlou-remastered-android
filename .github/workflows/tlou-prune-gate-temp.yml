name: TLOU prune gate CPU parity A/B temporary
on:
  push:
    branches: ['perf/tlou-ring-prune-gate-20261109']
    paths:
      - 'gow3_pc/gpu/shadps4/video_core/renderer_vulkan/tlou_pending_prune_gate.h'
      - 'gow3_pc/tests/test_tlou_pending_prune_gate.cpp'
      - 'gow3_pc/gpu/shadps4/video_core/renderer_vulkan/vk_rasterizer.cpp'
      - 'gow3_pc/gpu/shadps4/video_core/renderer_vulkan/vk_rasterizer.h'
      - 'android/bionic/test_runtime_contracts.sh'
      - '.github/workflows/tlou-prune-gate-temp.yml'
permissions:
  contents: read
jobs:
  prune:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify production prune-gate semantics and measure CPU speedup
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -I gow3_pc/gpu/shadps4 \
            gow3_pc/tests/test_tlou_pending_prune_gate.cpp -o /tmp/prune-gate
          /tmp/prune-gate --cost-gate
      - name: Address/undefined sanitizers
        run: |
          set -euo pipefail
          g++ -std=c++20 -O1 -g -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I gow3_pc/gpu/shadps4 \
            gow3_pc/tests/test_tlou_pending_prune_gate.cpp -o /tmp/prune-gate-sanitized
          /tmp/prune-gate-sanitized --correctness-only
