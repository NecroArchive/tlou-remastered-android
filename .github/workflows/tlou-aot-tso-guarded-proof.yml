name: TLOU AOT TSO guarded compiler - source and ARM64 multicore gate

on:
  push:
    branches: [experiment/tlou-aot-tso-acquire-release-screen-20261114]
    paths:
      - 'android/aot/patch_recompiler_tso_aligned_ar.py'
      - 'android/aot/test_tso_aligned_ar.py'
      - 'android/aot/build_recompiler_tso.sh'
      - 'gow3_pc/tests/test_tlou_aot_tso_guarded.cpp'
      - 'gow3_pc/tests/test_tlou_aot_tso_litmus.cpp'
      - '.github/workflows/tlou-aot-tso-guarded-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-guard:
    name: Compiler-source patch / strict fallbacks / upstream diff
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate source patch, alignment guards and baseline
        run: |
          set -euo pipefail
          python3 -m py_compile android/aot/patch_recompiler_tso.py android/aot/patch_recompiler_tso_aligned_ar.py android/aot/test_tso_aligned_ar.py
          python3 android/aot/test_tso_aligned_ar.py -v
          python3 android/aot/test_tso_one_fence.py -v
          bash -n android/aot/build_recompiler_tso.sh
      - name: Patch ACTUAL pinned upstream compiler and verify unaffected native instruction cases
        run: |
          set -euo pipefail
          mkdir -p out/tso-upstream-proof
          cd out/tso-upstream-proof
          git init -q upstream
          cd upstream
          git remote add origin https://github.com/ducvd89/Bloodborne-android-rebuild-tool.git
          git fetch --depth=1 origin 6ebb33b0c729a3942fddaa03965360c699d7d900
          git checkout --detach -f FETCH_HEAD
          cd ../../..
          python3 android/aot/patch_recompiler_tso.py out/tso-upstream-proof/upstream
          python3 android/aot/patch_recompiler_vpcmpistrx.py out/tso-upstream-proof/upstream
          python3 android/aot/patch_recompiler_tso_aligned_ar.py out/tso-upstream-proof/upstream
          python3 android/aot/patch_recompiler_tso_aligned_ar.py out/tso-upstream-proof/upstream
          grep -q '4-tlou-tso-aligned-ar-v1' out/tso-upstream-proof/upstream/src/version.h
          grep -q 'ld->setAtomic(AtomicOrdering::Acquire)' out/tso-upstream-proof/upstream/src/lower_ops.cpp
          grep -q 'st->setAtomic(AtomicOrdering::Release)' out/tso-upstream-proof/upstream/src/lower_ops.cpp
          grep -q 'tso.acquire.unaligned' out/tso-upstream-proof/upstream/src/lower_ops.cpp
          grep -q 'tso.release.unaligned' out/tso-upstream-proof/upstream/src/lower_ops.cpp
          (cd out/tso-upstream-proof/upstream && git diff --check && git diff --stat)
  arm64-runtime:
    name: ARM64 aligned and unaligned exact-value / MP LB SB IRIW
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Benchmark guarded 8/16/32/64-bit accesses with actual unaligned fallback
        run: |
          set -euo pipefail
          mkdir -p out/tso-arm64-proof
          c++ -std=c++20 -O2 -UNDEBUG -Wall -Wextra -Werror gow3_pc/tests/test_tlou_aot_tso_guarded.cpp -o out/tso-arm64-proof/guarded
          out/tso-arm64-proof/guarded | tee out/tso-arm64-proof/guarded.txt
          test "$(grep -c '^TLOU ARM64 TSO GUARDED' out/tso-arm64-proof/guarded.txt)" -eq 12
          grep -q 'size=8 unaligned=50%' out/tso-arm64-proof/guarded.txt
      - name: Verify ARM64 atomic instructions and run multiple concurrent guest-like threads
        run: |
          set -euo pipefail
          c++ -std=c++20 -O2 -UNDEBUG -Wall -Wextra -Werror -pthread gow3_pc/tests/test_tlou_aot_tso_litmus.cpp -o out/tso-arm64-proof/litmus
          c++ -std=c++20 -O2 -S gow3_pc/tests/test_tlou_aot_tso_guarded.cpp -o out/tso-arm64-proof/guarded.s
          grep -q 'ldar' out/tso-arm64-proof/guarded.s
          grep -q 'stlr' out/tso-arm64-proof/guarded.s
          grep -q 'dmb' out/tso-arm64-proof/guarded.s
          out/tso-arm64-proof/litmus | tee out/tso-arm64-proof/litmus.txt
          grep -q '^TLOU TSO MP ARM64.*PASS' out/tso-arm64-proof/litmus.txt
          grep -q '^TLOU TSO LB ARM64.*PASS' out/tso-arm64-proof/litmus.txt
          grep -q '^TLOU TSO IRIW ARM64.*PASS' out/tso-arm64-proof/litmus.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TLOU-AOT-TSO-Guarded-ARM64-Proof
          path: out/tso-arm64-proof/*.txt
          if-no-files-found: warn

  compile-aot-experimental:
    name: Build actual AArch64 bb-recomp LLVM compiler v4 (NOT APK)
    needs: [source-guard, arm64-runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      TLOU_AOT_BUILD_JOBS: '4'
      TLOU_TSO_ALIGNED_AR_EXPERIMENT: '1'
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/29.0.14206865
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 ndk;29.0.14206865'
      - name: Install cross-compiler requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd ninja-build cmake clang lld xz-utils
      - name: Reuse matching LLVM/FEX toolchain build inputs if GitHub cache permits
        uses: actions/cache@v4
        with:
          path: |
            .local-deps/bb-recomp-tlou/.local-deps/llvm/x
            .local-deps/bb-recomp-tlou/.local-deps/llvm/src
            .local-deps/bb-recomp-tlou/.local-deps/llvm/build-android
            .local-deps/bb-recomp-tlou/.local-deps/deps
            .local-deps/bb-recomp-tlou/.local-deps/mimalloc
            .local-deps/bb-recomp-tlou/out/recomp-fex
          key: tlou-llvm23-android-fex2609-tso1-aligned-ar-v4
          restore-keys: |
            tlou-llvm23-android-fex2609-tso1
      - name: Compile real patched TLOU bb-recomp compiler against pinned upstream LLVM23
        run: |
          set -euo pipefail
          bash android/aot/build_recompiler_tso.sh
      - name: Verify actual ARM64 compiler binary and invalidated AOT shard key
        run: |
          set -euo pipefail
          c=.local-deps/bb-recomp-tlou/out/android/libbbrecomp.so
          test -s "$c"
          readelf -h "$c" | grep -F AArch64
          readelf -d "$c" | grep -E 'libc.so|libm.so|libdl.so'
          grep -q 'BBR_COMPILER_VERSION "4-tlou-tso-aligned-ar-v1"' .local-deps/bb-recomp-tlou/src/version.h
          grep -q 'tso.acquire.unaligned' .local-deps/bb-recomp-tlou/src/lower_ops.cpp
          grep -q 'tso.release.unaligned' .local-deps/bb-recomp-tlou/src/lower_ops.cpp
          # Don't pipe tar into grep -q under pipefail: grep closes early,
          # making tar fail with SIGPIPE (exit code 2) on an otherwise valid archive.
          archive=out/android-bionic/aot-tso-compiler/bb-recomp-android-aarch64.tar.xz
          tar -tf "$archive" > out/android-bionic/aot-tso-compiler/archive-contents.txt
          grep -Eq '(^|/)libbbrecomp[.]so
          (cd out/android-bionic/aot-tso-compiler && sha256sum -c bb-recomp-android-aarch64.tar.xz.sha256)
      - name: Publish separate compiler binary WITHOUT altering production APK
        uses: actions/upload-artifact@v4
        with:
          name: TLOU-LLVM23-AOT-TSO-ALIGNED-AR-v4-COMPILER-ONLY
          path: |
            out/android-bionic/aot-tso-compiler/bb-recomp-android-aarch64.tar.xz
            out/android-bionic/aot-tso-compiler/bb-recomp-android-aarch64.tar.xz.sha256
            out/android-bionic/aot-tso-compiler/README-TLOU-TSO.txt
          if-no-files-found: error
      - name: Upload compiler diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TLOU-AOT-TSO-v4-compiler-build-logs
          path: |
            .local-deps/bb-recomp-tlou/out/llvm-android-cfg.log
            .local-deps/bb-recomp-tlou/out/llvm-android-build.log
            .local-deps/bb-recomp-tlou/out/android-ndk.cfg.log
          if-no-files-found: ignore
 out/android-bionic/aot-tso-compiler/archive-contents.txt
          (cd out/android-bionic/aot-tso-compiler && sha256sum -c bb-recomp-android-aarch64.tar.xz.sha256)
      - name: Publish separate compiler binary WITHOUT altering production APK
        uses: actions/upload-artifact@v4
        with:
          name: TLOU-LLVM23-AOT-TSO-ALIGNED-AR-v4-COMPILER-ONLY
          path: |
            out/android-bionic/aot-tso-compiler/bb-recomp-android-aarch64.tar.xz
            out/android-bionic/aot-tso-compiler/bb-recomp-android-aarch64.tar.xz.sha256
            out/android-bionic/aot-tso-compiler/README-TLOU-TSO.txt
          if-no-files-found: error
      - name: Upload compiler diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TLOU-AOT-TSO-v4-compiler-build-logs
          path: |
            .local-deps/bb-recomp-tlou/out/llvm-android-cfg.log
            .local-deps/bb-recomp-tlou/out/llvm-android-build.log
            .local-deps/bb-recomp-tlou/out/android-ndk.cfg.log
          if-no-files-found: ignore
