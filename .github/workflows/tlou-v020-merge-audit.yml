name: TLOU v0.2.0 release-base merge audit
on:
  push:
    branches: [tlou-v020-from-stable-011]
    paths: ['.github/workflows/tlou-v020-merge-audit.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    name: Three-way merge with signed 0.1.1 release base
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit merge without changing either release branch
        shell: bash
        run: |
          set -eu
          mkdir -p out/merge-audit
          git config user.name "TLOU Merge Audit"
          git config user.email "tlou-merge-audit@users.noreply.github.com"
          git fetch --no-tags origin android-bionic-stage1
          echo "Stable baseline: $(git rev-parse HEAD)" | tee out/merge-audit/heads.txt
          echo "Development tip: $(git rev-parse FETCH_HEAD)" | tee -a out/merge-audit/heads.txt
          set +e
          git merge --no-commit --no-ff FETCH_HEAD > out/merge-audit/merge-output.txt 2>&1
          result=$?
          set -e
          echo "Merge exit status: $result"
          cat out/merge-audit/merge-output.txt
          git diff --name-only --diff-filter=U | tee out/merge-audit/conflicts.txt
          git status --short > out/merge-audit/changes.txt
          echo "Conflicts: $(wc -l < out/merge-audit/conflicts.txt)"
          echo "Changed files: $(wc -l < out/merge-audit/changes.txt)"
          echo "--- conflicted paths ---"
          cat out/merge-audit/conflicts.txt
          if [ -f .git/MERGE_HEAD ]; then git merge --abort; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tlou-v020-three-way-merge-report
          path: out/merge-audit/
          if-no-files-found: error

  integrate:
    name: Merge v0.2 onto signed v0.1.1 source and check regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge source trees preserving the original release workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TLOU Integration Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin android-bionic-stage1
          if git merge --no-commit --no-ff FETCH_HEAD; then
            echo "Three-way merge completed without conflicts"
          else
            echo "Merge returned conflicts; selecting reviewed temporary resolutions"
            git status --short | tail -30
            git diff --name-only --diff-filter=U | sort > /tmp/tlou-conflicts.txt
            # Only the 22 exact conflicts reviewed against the v0.1.1 and v0.2.0 trees.
            cat > /tmp/expected-conflicts.txt <<'EXPECTED'
          .github/workflows/tlou-native-apk.yml
          RELEASE_NOTES.md
          android-launcher/app/build.gradle
          android-launcher/app/src/main/assets/ui-translations.tsv
          android-launcher/app/src/main/java/ro/cobrabm/fexdroid/AboutPanel.java
          android-launcher/app/src/main/java/ro/cobrabm/fexdroid/GameActivity.java
          android-launcher/app/src/main/java/ro/cobrabm/fexdroid/GameInstallState.java
          android-launcher/app/src/main/java/ro/cobrabm/fexdroid/HudTelemetry.java
          android-launcher/app/src/main/java/ro/cobrabm/fexdroid/MainActivity.java
          android-launcher/app/src/main/java/ro/cobrabm/fexdroid/PortMenu.java
          android-launcher/app/src/main/java/ro/cobrabm/fexdroid/PortSettings.java
          android-launcher/app/src/test/java/ro/cobrabm/fexdroid/GameInstallStateTest.java
          android/bionic/test_runtime_contracts.sh
          android/tests/test_tlou_111_optional_light_shadows.py
          android/tests/test_tlou_fps_unlock_runtime.py
          android/tests/test_tlou_release_011.py
          android/tests/test_tlou_shader_scan_diagnostic.py
          android/tlou_patches.py
          gow3_pc/gpu/shadps4/video_core/buffer_cache/buffer_cache.h
          gow3_pc/gpu/shadps4/video_core/renderer_vulkan/vk_scheduler.cpp
          gow3_pc/src/runtime_memory.c
          gow3_pc/tests/test_memory_walk_cost.c
          EXPECTED
            sort -o /tmp/expected-conflicts.txt /tmp/expected-conflicts.txt
            echo "Comparing expected conflict set"
            diff -u /tmp/expected-conflicts.txt /tmp/tlou-conflicts.txt
            echo "Conflict set matches; applying temporary resolutions"
            # Keep old signed release workflow; it will be adapted only after
            # validating the source merge and preserving the 0.1.1 signer.
            git checkout --ours -- .github/workflows/tlou-native-apk.yml
            # Preserve the latest stable regression tests where the branch
            # contains older, conflicting versions.
            # Prefer 0.2 behavior in the explicitly conflicting launcher,
            # patches, native runtime and release notes; independently changed
            # 0.1.1 code elsewhere is merged by Git's 3-way algorithm.
            while IFS= read -r file; do
              case "$file" in
                .github/workflows/tlou-native-apk.yml) ;;
                *) git checkout --theirs -- "$file" ;;
              esac
            done < /tmp/expected-conflicts.txt
          fi
          # The stable signer and release job hierarchy are retained instead
          # of replacing them with the experimental two-job Vulkan/AOT workflow.
          # Update the release contract to validate that architecture, without
          # weakening the required certificate and APK identity checks.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/tests/test_tlou_release_011.py')
          s=p.read_text()
          start=s.index('        self.assertIn("branches: [android-bionic-stage1]",workflow)')
          stop=s.index('        self.assertIn("v0.2.0",(ROOT/"RELEASE_NOTES.md").read_text())',start)
          checks=[
            'self.assertIn("name: TLOU Bionic Full Native and APK",workflow)',
            'self.assertIn("tlou-ui-approval-log32-20261105",workflow)',
            'self.assertIn("key: tlou-development-signing-v2",workflow)',
            'self.assertIn("bash android/bionic/package_apk.sh",workflow)',
            'self.assertIn("Restore signing identity used by existing installations",workflow)',
            'self.assertIn("app:assembleRelease",workflow)',
            'self.assertNotIn("app:assembleDebug",workflow)',
          ]
          s=s[:start]+''.join('        '+line+'\\n' for line in checks)+s[stop:]
          p.write_text(s)
          PY
          # Git retains unmerged index stages until the resolved files are staged.
          git add -A
          echo "Checking unresolved index entries"
          test -z "$(git diff --name-only --diff-filter=U)"
          git commit -m "wip(tlou): integrate v0.2 features onto signed v0.1.1 release lineage"
          echo "New merged source $(git rev-parse HEAD)"
          git log -1 --format='%P'
          git diff --stat HEAD^1 HEAD | tail -8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Python source contract suite on merged tree
        run: |
          python3 -m pip install unicorn==2.1.4
          python3 -m unittest discover -s android/tests -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Compile launcher and run release unit tests
        run: gradle -p android-launcher :app:testReleaseUnitTest :app:lintVitalRelease --no-daemon --max-workers=2
      - name: Publish tested merge only to temporary integration branch
        run: |
          test "$GITHUB_REF_NAME" = "tlou-v020-from-stable-011"
          git push origin HEAD:refs/heads/tlou-v020-from-stable-011
      - name: Save merge test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tlou-v020-merge-validation-errors
          path: |
            android-launcher/app/build/reports/**
            /tmp/tlou-conflicts.txt
          if-no-files-found: ignore
