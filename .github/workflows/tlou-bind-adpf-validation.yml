name: TLOU ADPF and exact hot-binding CPU validation
on:
  push:
    branches: [perf/tlou-stagea-bindings-adpf-20261110]
    paths: [gow3_pc/**, .github/workflows/tlou-bind-adpf-validation.yml]
permissions:
  contents: read
jobs:
  hot-bindings:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install native header dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libfmt-dev libboost-dev libspdlog-dev
      - name: Build and verify exact shader sharp fetch and readback counts
        run: |
          g++ -std=c++20 -O2 -UNDEBUG -Wall -Wextra -Werror \
            -I gow3_pc/gpu/shadps4 \
            gow3_pc/tests/test_tlou_hot_bindings.cpp -o /tmp/tlou-hot-bindings -lfmt
          /tmp/tlou-hot-bindings
      - name: Validate ADPF native ABI graceful fallback
        run: |
          cat >/tmp/adpf-test.cpp <<'CPP'
          #include "video_core/renderer_vulkan/tlou_adpf.h"
          int main() {
              Vulkan::Detail::TlouAdpfCommandHint hint;
              for(unsigned i=0;i<3000;++i)hint.NotePostDraw(i/900);
          }
          CPP
          g++ -std=c++20 -O2 -D__ANDROID__ -Wall -Wextra -Werror \
            -I gow3_pc/gpu/shadps4 /tmp/adpf-test.cpp -ldl -o /tmp/adpf-test
          GOW3_ADPF=1 /tmp/adpf-test
      - name: Address and UB sanitizer verification
        run: |
          g++ -std=c++20 -O1 -g -UNDEBUG -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I gow3_pc/gpu/shadps4 \
            gow3_pc/tests/test_tlou_hot_bindings.cpp -o /tmp/tlou-hot-sanitize -lfmt
          /tmp/tlou-hot-sanitize
